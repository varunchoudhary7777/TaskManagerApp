server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # React Router owns client-side routes such as /projects and /tasks.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
